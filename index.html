
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Hauno's lunch by Tate ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="heading">
      <p class="eyebrow">A LITTLE SOMETHING FOR YOU ♡</p>
      <h1>Made with love<span>.</span></h1>
      <p class="subtitle">A little lunch, just for Hauno.</p>
    </header>

    <section class="lunch-scene" aria-label="Interactive 3D lunch box">
      <div id="loading">Preparing something special ♡</div>
      <canvas id="lunch-canvas" aria-label="Tap the 3D lunch box to open it"></canvas>
      <div class="tap-hint" id="tap-hint">
        <span class="heart">♡</span>
        <span>tap the lunch box to open</span>
      </div>
    </section>

    <footer class="footer">
      <p id="message">A little box full of love, made just for you.</p>
      <span class="signature">with love, Tate ♡</span>
      <button id="replay" type="button" hidden>Close the lunch box ↺</button>
    </footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
